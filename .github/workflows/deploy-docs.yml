name: Deploy docs to Pages

on:
  push:
    branches:
      - main
    paths:
      - '**.roc'
      - 'docs/index.html'
      - '.github/workflows/deploy-docs.yml'
  # Re-deploy when a release is published. Its docs.tar.gz was attached while
  # the release was still a draft (see release.yml), so it is already there to
  # serve.
  release:
    types: [published]

  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # A release event runs on the tag, and the github-pages environment only
  # accepts deployments from the default branch, so a deploy from here would
  # be rejected outright. Hand the work to a run on main instead. A
  # workflow_dispatch is one of the two events GITHUB_TOKEN is allowed to
  # raise, so this does start a new run.
  dispatch:
    name: Deploy from main instead
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-docs.yml --ref main --repo "$GITHUB_REPOSITORY"

  deploy:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: niclas-ahden/roc-workflows/.github/workflows/deploy-docs.yml@v3
