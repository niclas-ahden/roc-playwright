name: Test latest release on latest nightly Roc

# Every morning, test the latest published roc-playwright bundle, by its real
# URL, on the newest Roc nightly. Green moves the recommendation forward in
# that release's notes. Red means we adapt to Roc, or report a bug.
#
# Two lanes. Required is speed, which decides. Optional is dev, size and
# interpreter, which run too but must not hold back a recommendation.
#
# Publishing does not trigger this. The release workflow already tested that
# bundle while it was a draft.

on:
  schedule:
    # Nightlies publish between 10:00 and 13:30 UTC.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-roc
  cancel-in-progress: false

jobs:
  # Looks up the latest release and the latest Roc nightly, once, so every leg
  # runs the exact same nightly against the exact same release.
  roc-versions:
    name: 'Required: look up the release and the latest Roc'
    uses: niclas-ahden/roc-workflows/.github/workflows/resolve-versions.yml@v3
    with:
      release: true

  # suite.yml runs `setup` and `teardown` out of the checkout under test, so a
  # release from before those scripts existed has no way to install Playwright.
  # Say so and test nothing, rather than let a missing file be reported as a Roc
  # regression by the job at the bottom.
  hooks:
    name: 'Required: does the release carry the suite hooks'
    needs: roc-versions
    runs-on: ubuntu-24.04
    # The one place the hook paths are written down. The legs below read them
    # back out, so a rename can never leave this job checking for one file
    # while the suite runs another.
    outputs:
      present: ${{ steps.check.outputs.present }}
      setup: ${{ steps.check.outputs.setup }}
      teardown: ${{ steps.check.outputs.teardown }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.roc-versions.outputs.release }}

      - id: check
        env:
          RELEASE: ${{ needs.roc-versions.outputs.release }}
          SETUP: .github/scripts/setup.sh
          TEARDOWN: .github/scripts/teardown.sh
        run: |
          {
            echo "setup=$SETUP"
            echo "teardown=$TEARDOWN"
          } >> "$GITHUB_OUTPUT"
          if [ -f "$SETUP" ] && [ -f "$TEARDOWN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE carries the hooks"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$RELEASE predates $SETUP, so there is no way to install Playwright for it. Nothing is tested against it, and its notes keep whatever nightly they already name."
          fi

  # The versions go in the job name, because `run-name` cannot see `needs`.
  test:
    name: 'Required: latest Roc'
    needs: [roc-versions, hooks]
    if: needs.hooks.outputs.present == 'true'
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      roc: ${{ needs.roc-versions.outputs.nightly }}
      label: roc-playwright ${{ needs.roc-versions.outputs.release }} on ${{ needs.roc-versions.outputs.nightly }}
      ref: ${{ needs.roc-versions.outputs.release }}
      bundle-url: ${{ needs.roc-versions.outputs.bundle }}
      node: true
      setup: ${{ needs.hooks.outputs.setup }}
      teardown: ${{ needs.hooks.outputs.teardown }}

  other-backends:
    name: 'Optional: latest Roc, other backends'
    needs: [roc-versions, hooks]
    if: needs.hooks.outputs.present == 'true'
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      roc: ${{ needs.roc-versions.outputs.nightly }}
      label: roc-playwright ${{ needs.roc-versions.outputs.release }} on ${{ needs.roc-versions.outputs.nightly }}
      opts: '["dev", "size", "interpreter"]'
      ref: ${{ needs.roc-versions.outputs.release }}
      bundle-url: ${{ needs.roc-versions.outputs.bundle }}
      node: true
      setup: ${{ needs.hooks.outputs.setup }}
      teardown: ${{ needs.hooks.outputs.teardown }}

  # Green on every required leg: recommend this nightly in the tested
  # release's notes.
  recommend:
    name: Recommend this Roc in the release notes
    needs: [roc-versions, test]
    permissions:
      contents: write
    uses: niclas-ahden/roc-workflows/.github/workflows/name-nightly.yml@v3
    with:
      release: ${{ needs.roc-versions.outputs.release }}
      nightly: ${{ needs.roc-versions.outputs.nightly }}

  name-commit-range:
    name: Name the Roc commit range that broke it
    needs: [roc-versions, test]
    # Only for a red suite. A failed `roc-versions` would leave every version
    # below empty.
    if: needs.test.result == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Name the commit range
        run: |
          echo "::error::roc-playwright ${{ needs.roc-versions.outputs.release }} fails on roc ${{ needs.roc-versions.outputs.nightly }}"
          echo "  https://github.com/roc-lang/roc/compare/${{ needs.roc-versions.outputs.prev_sha }}...${{ needs.roc-versions.outputs.sha }}"
