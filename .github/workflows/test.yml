name: Test

# Two lanes. Required is the one check a release needs, and Optional is
# everything else, which may be red without holding anything up.
#
# A job's `name` here is the lane and the subject, and the reusable workflow
# it calls names the work, so a check reads "Required / Test" or "Optional:
# latest Roc / Tests (speed, ubuntu-24.04)". Required jobs are defined first
# so the graph draws them on top.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks shared by every Roc package of ours, under the compiler the
  # flake pins, which is the one the dev shell hands you: roc check, roc test,
  # a bundle sanity check and ./tests.roc, which is the whole Playwright suite
  # running under `nix develop`.
  test:
    name: Required
    uses: niclas-ahden/roc-workflows/.github/workflows/test.yml@v3
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Looks up the newest Roc nightly, once, so every leg below tests the same
  # one.
  roc-versions:
    name: 'Optional: look up Roc versions'
    uses: niclas-ahden/roc-workflows/.github/workflows/resolve-versions.yml@v3

  # What a package that spawns browsers has to prove per operating system, on
  # the newest downloaded nightly, because that is the compiler its users have:
  # the suite passes, and nothing it started outlives the program that started
  # it. Every backend runs, so we see the day one breaks, or the day one goes
  # green. Nothing reads the result, so one call covers them all.
  latest-roc:
    name: 'Optional: latest Roc'
    needs: roc-versions
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      roc: ${{ needs.roc-versions.outputs.nightly }}
      label: Tests
      opts: '["speed", "dev", "size", "interpreter"]'
      node: true
      setup: .github/scripts/setup.sh
      teardown: .github/scripts/teardown.sh
