name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package checks shared by every Roc package of ours: roc check, roc
  # test, a bundle sanity check, and ./tests.roc under the flake's compiler.
  test:
    uses: niclas-ahden/roc-workflows/.github/workflows/test.yml@v2
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # What a package that spawns processes has to prove per operating system:
  # the suite passes, and nothing it started survives the program that
  # started it.
  platforms:
    uses: ./.github/workflows/suite.yml
    with:
      roc: pinned
      label: Pinned

  # Informational and not branch-protected. Running the other backends
  # anyway means we see the day one breaks, or the day dev goes green.
  advisory:
    uses: ./.github/workflows/suite.yml
    with:
      roc: pinned
      label: Advisory
      opts: '["dev", "size", "interpreter"]'
